<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.5px;
        text-anchor: middle;
        animation: float 4s ease-in-out infinite;
        transform-origin: center;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #94a3b8;
        text-anchor: middle;
        animation: float 4s ease-in-out infinite;
        animation-delay: 0.4s;
        transform-origin: center;
      }
      .animated-circle {
        animation: twinkle 3s infinite ease-in-out;
        transform-origin: center;
      }
      .bar-glow {
        animation: pulse 3s infinite ease-in-out;
        transform-origin: center;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="250" fill="url(#bgGrad)" />
  <rect width="800" height="250" fill="url(#grid)" />
  <circle cx="400" cy="120" r="280" fill="url(#glow)" />

  <!-- Animated Particles in Background -->
  <circle class="animated-circle" cx="70" cy="45" r="2.5" fill="#38bdf8" style="animation-delay: 0s;" />
  <circle class="animated-circle" cx="730" cy="190" r="3" fill="#c084fc" style="animation-delay: 0.8s;" />
  <circle class="animated-circle" cx="120" cy="205" r="2" fill="#818cf8" style="animation-delay: 1.5s;" />
  <circle class="animated-circle" cx="680" cy="55" r="2.5" fill="#38bdf8" style="animation-delay: 2.2s;" />
  <circle class="animated-circle" cx="210" cy="65" r="2" fill="#c084fc" style="animation-delay: 1.1s;" />

  <!-- Decorative Mail Route Line in Background -->
  <path d="M 80,180 C 220,150 320,210 440,185 S 640,140 740,170" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5" stroke-opacity="0.25" />

  <!-- Foreground Content: Brand Icon, Title, and Subtitle -->
  <g>
    <!-- Envelope Icon Symbol -->
    <g transform="translate(400, 48)">
      <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M -10,-6 L 10,-6 C 11,-6 12,-5 12,-4 L 12,6 C 12,7 11,8 10,8 L -10,8 C -11,8 -12,7 -12,6 L -12,-4 C -12,-5 -11,-6 -10,-6 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <path d="M -11,-5 L 0,3 L 11,-5" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="400" y="105" class="title-text" fill="url(#textGrad)">Awesome Transactional Email</text>
    <text x="400" y="138" class="subtitle-text">Curated Delivery Ecosystem: SaaS Providers, API Infrastructure &amp; Self-Hosted Systems</text>
  </g>

  <!-- Glowing Accent Divider Bar -->
  <rect class="bar-glow" x="275" y="160" width="250" height="3" rx="1.5" fill="url(#textGrad)" fill-opacity="0.85" />

  <!-- Feature Pillar Pills in Foreground -->
  <g transform="translate(400, 198)">
    <!-- Pill 1: High Deliverability -->
    <g transform="translate(-225, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" class="tag-text" fill="#38bdf8">High Deliverability</text>
    </g>
    <!-- Pill 2: Stream Isolation -->
    <g transform="translate(-75, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" class="tag-text" fill="#818cf8">Stream Isolation</text>
    </g>
    <!-- Pill 3: Self-Hosted OSS -->
    <g transform="translate(75, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" class="tag-text" fill="#c084fc">Self-Hosted OSS</text>
    </g>
    <!-- Pill 4: Modern APIs -->
    <g transform="translate(225, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" class="tag-text" fill="#34d399">Developer APIs</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="247" width="800" height="3" fill="url(#textGrad)" />
</svg>
